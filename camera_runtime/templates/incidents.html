<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19">
    <title>Hotspot Incident Archive — Fire Sentinel 360</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            background-color: var(--bg-main, #0b0f19);
            color: var(--text-main, #f3f4f6);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .archive-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-header-left h1 {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin: 0 0 2px 0;
            letter-spacing: 0.5px;
        }

        .nav-header-left p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .nav-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Filter & Action Toolbar */
        .toolbar-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            outline: none;
            min-width: 200px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--cyan-primary);
        }

        .filter-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--cyan-primary);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .stat-badge {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.35);
            color: var(--cyan-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Incidents List Grid */
        .incidents-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .incident-card-full {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(12px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .incident-card-full:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .inc-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .inc-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .inc-id-tag {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .inc-actions-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Dual Snapshots Display */
        .snapshots-compare-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .snapshot-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .snapshot-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
        }

        .snapshot-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            overflow: hidden;
            background: #050811;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snapshot-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .snapshot-img-wrap:hover img {
            transform: scale(1.03);
        }

        .img-zoom-hint {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Multi-Round Horizontal Track */
        .rounds-section {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .rounds-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rounds-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(6, 182, 212, 0.4) rgba(0, 0, 0, 0.3);
        }

        .round-card-mini {
            flex: 0 0 130px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .round-card-mini:hover {
            border-color: var(--cyan-primary);
        }

        .round-card-thumb-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            height: 55px;
            cursor: pointer;
        }

        .round-card-thumb-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        .btn-delete-round {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.85);
            border: none;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .round-card-mini:hover .btn-delete-round {
            opacity: 1;
        }

        .round-card-mini .btn-delete-round:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        /* LLM Verification Section */
        .llm-verification-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.85));
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }
        .llm-verification-box.llm-unverified {
            border: 1px dashed rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.5);
        }
        .badge-risk-high {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }
        .badge-risk-medium {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.5);
            color: #f59e0b;
        }
        .badge-risk-low {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #3b82f6;
        }
        .badge-risk-false-alarm {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10b981;
        }
        .spinner-mini {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Metrics Grid */
        .inc-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }

        .inc-metric-pill {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 6px 10px;
        }

        .inc-metric-pill .lbl {
            font-size: 9.5px;
            font-weight: 700;
            color: #94a3b8;
        }

        .inc-metric-pill .val {
            font-size: 13px;
            font-weight: 800;
        }

        /* Empty State */
        .empty-state-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state-box h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 6px;
        }

        .empty-state-box p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .snapshots-compare-container {
                grid-template-columns: 1fr;
            }

            .snapshot-img-wrap {
                aspect-ratio: 16 / 9;
                height: auto;
            }

            .archive-container {
                padding: 10px 8px;
            }

            .toolbar-card {
                padding: 10px;
            }

            .search-input {
                width: 100%;
                min-width: 0;
            }

            .btn-delete-round {
                opacity: 1;
            }
        }
    </style>
</head>
<body class="theme-dark">
    <div class="archive-container">
        <!-- Top Navigation Header -->
        <header class="nav-header">
            <div class="nav-header-left">
                <h1>HOTSPOT INCIDENT ARCHIVE</h1>
                <p>Comprehensive History of Detected Thermal Hotspots & Dual Camera Snapshots</p>
            </div>
            <div class="nav-header-right">
                <a href="/" class="btn btn-secondary font-mono" style="font-size: 11px; padding: 6px 14px; text-decoration: none;">
                    DASHBOARD
                </a>
                <a href="/ptz_test" class="btn btn-secondary font-mono" style="font-size: 11px; padding: 6px 12px; text-decoration: none;">
                    PTZ TEST
                </a>
                <a href="/settings" class="btn btn-secondary font-mono" style="font-size: 11px; padding: 6px 12px; text-decoration: none;">
                    SETTINGS
                </a>
                <div class="telemetry-pill">
                    <span class="dot dot-green"></span>
                    <span id="system-time" class="font-mono">--:--:--</span>
                </div>
            </div>
        </header>

        <!-- Filter & Control Toolbar -->
        <div class="toolbar-card">
            <div class="toolbar-left">
                <span class="stat-badge" id="badge-total-incidents">0 Incidents</span>
                <select class="filter-select font-mono" id="filter-trend-select">
                    <option value="ALL">All Growth Trends</option>
                    <option value="EXPANDING">Expanding Only</option>
                    <option value="STABLE">Stable Only</option>
                    <option value="SHRINKING">Shrinking Only</option>
                    <option value="NEW_DETECTION">New Detections</option>
                </select>
                <input type="text" class="search-input font-mono" id="search-incidents-input" placeholder="Search ID, Az/Alt, or Date..." />
            </div>
            <div class="toolbar-right">
                <button type="button" class="btn btn-secondary" id="btn-refresh-archive" style="font-size: 11.5px; padding: 6px 12px;">
                    REFRESH
                </button>
                <button type="button" class="btn btn-danger" id="btn-clear-all-archive" style="font-size: 11.5px; padding: 6px 12px;">
                    CLEAR ALL RECORDS
                </button>
            </div>
        </div>

        <!-- Incidents List Container -->
        <main class="incidents-grid" id="incidents-list-container">
            <!-- Dynamically Rendered Incident Cards -->
            <div class="empty-state-box">
                <h3>Loading recorded incidents...</h3>
            </div>
        </main>
    </div>

    <!-- Image Lightbox Modal with Arrow Navigation -->
    <div id="image-modal" class="image-modal-overlay" style="display: none;">
        <div class="image-modal-backdrop" id="image-modal-backdrop"></div>
        <div class="image-modal-container">
            <div class="image-modal-header">
                <div class="image-modal-title" id="image-modal-title">HOTSPOT SNAPSHOT VIEW</div>
                <button class="image-modal-close" id="image-modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div class="image-modal-body">
                <button type="button" class="modal-nav-btn modal-nav-prev" id="modal-btn-prev" title="Previous Image">&#x276E;</button>
                <img id="image-modal-img" src="" alt="Snapshot Full View" />
                <button type="button" class="modal-nav-btn modal-nav-next" id="modal-btn-next" title="Next Image">&#x276F;</button>
            </div>
            <div class="image-modal-footer">
                <span id="image-modal-info" class="font-mono text-cyan"></span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="image-modal-counter" class="font-mono text-orange" style="font-size: 11px; font-weight: 700;">1 / 1</span>
                    <a id="image-modal-download" href="#" target="_blank" download class="btn btn-secondary font-mono" style="padding: 4px 12px; font-size: 11px;">
                        DOWNLOAD FULL RES
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // System Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const el = document.getElementById('system-time');
            if (el) el.textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let allIncidents = [];
        let activeModalImages = [];
        let currentModalImgIdx = 0;

        // Modal Elements
        const modalOverlay = document.getElementById("image-modal");
        const modalImg = document.getElementById("image-modal-img");
        const modalTitle = document.getElementById("image-modal-title");
        const modalInfo = document.getElementById("image-modal-info");
        const modalCounter = document.getElementById("image-modal-counter");
        const modalDownload = document.getElementById("image-modal-download");
        const modalClose = document.getElementById("image-modal-close");
        const modalBackdrop = document.getElementById("image-modal-backdrop");
        const modalBtnPrev = document.getElementById("modal-btn-prev");
        const modalBtnNext = document.getElementById("modal-btn-next");

        function openModalGallery(images, startIdx = 0) {
            if (!images || images.length === 0) return;
            activeModalImages = images;
            currentModalImgIdx = Math.max(0, Math.min(startIdx, images.length - 1));
            renderModalImage();
            modalOverlay.style.display = "flex";
        }

        function renderModalImage() {
            if (!activeModalImages.length) return;
            const item = activeModalImages[currentModalImgIdx];
            modalImg.src = item.url;
            modalTitle.textContent = item.title || "HOTSPOT SNAPSHOT VIEW";
            modalInfo.textContent = item.info || "";
            modalCounter.textContent = `${currentModalImgIdx + 1} / ${activeModalImages.length}`;
            modalDownload.href = item.url;
            modalDownload.download = item.url.split("/").pop() || "snapshot.jpg";

            modalBtnPrev.style.display = activeModalImages.length > 1 ? "flex" : "none";
            modalBtnNext.style.display = activeModalImages.length > 1 ? "flex" : "none";
        }

        function prevModalImage() {
            if (activeModalImages.length <= 1) return;
            currentModalImgIdx = (currentModalImgIdx - 1 + activeModalImages.length) % activeModalImages.length;
            renderModalImage();
        }

        function nextModalImage() {
            if (activeModalImages.length <= 1) return;
            currentModalImgIdx = (currentModalImgIdx + 1) % activeModalImages.length;
            renderModalImage();
        }

        function closeModal() {
            modalOverlay.style.display = "none";
            modalImg.src = "";
            activeModalImages = [];
        }

        if (modalClose) modalClose.addEventListener("click", closeModal);
        if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);
        if (modalBtnPrev) modalBtnPrev.addEventListener("click", prevModalImage);
        if (modalBtnNext) modalBtnNext.addEventListener("click", nextModalImage);

        document.addEventListener("keydown", (e) => {
            if (modalOverlay.style.display === "flex") {
                if (e.key === "Escape") closeModal();
                else if (e.key === "ArrowLeft") prevModalImage();
                else if (e.key === "ArrowRight") nextModalImage();
            }
        });

        // Load Incidents from API
        async function fetchIncidents() {
            try {
                const res = await fetch("/api/incidents?limit=100");
                const data = await res.json();
                if (data.status === "ok") {
                    allIncidents = data.incidents || [];
                    renderIncidentsList();
                }
            } catch (err) {
                console.error("Failed to load incidents:", err);
            }
        }

        function getTrendBadgeClass(trend) {
            if (trend === "EXPANDING") return "badge-trend-expanding";
            if (trend === "SHRINKING") return "badge-trend-shrinking";
            if (trend === "STABLE") return "badge-trend-stable";
            return "badge-trend-new";
        }

        function renderIncidentsList() {
            const container = document.getElementById("incidents-list-container");
            const filterTrend = document.getElementById("filter-trend-select").value;
            const searchKeyword = document.getElementById("search-incidents-input").value.trim().toLowerCase();
            const badgeTotal = document.getElementById("badge-total-incidents");

            let filtered = allIncidents.filter(inc => {
                if (filterTrend !== "ALL" && inc.growth_trend !== filterTrend) {
                    return false;
                }
                if (searchKeyword) {
                    const textContent = `${inc.id} ${inc.first_detected} ${inc.last_updated} ${inc.azimuth} ${inc.altitude}`.toLowerCase();
                    if (!textContent.includes(searchKeyword)) return false;
                }
                return true;
            });

            if (badgeTotal) {
                badgeTotal.textContent = `${filtered.length} of ${allIncidents.length} Incidents`;
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state-box">
                        <h3>No Hotspot Incidents Found</h3>
                        <p>${allIncidents.length === 0 ? "The sentry system has not recorded any fire incidents yet." : "No incidents match your filter or search criteria."}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((inc) => {
                const trendClass = getTrendBadgeClass(inc.growth_trend);
                const trendLabel = inc.growth_trend_label || inc.growth_trend || "NEW DETECTION";
                const totalRounds = inc.scan_rounds || (inc.history ? inc.history.length : 1);
                const historyList = inc.history || [];

                // Prepare Gallery Images for this Incident
                const galleryImages = [];
                historyList.forEach((h, idx) => {
                    if (h.thermal_snapshot) {
                        const hThm = h.zoom_info && h.zoom_info.thermal ? h.zoom_info.thermal : (h.zoom_info || {});
                        const hThmFocal = hThm.focal_mm ? `${hThm.focal_mm}mm` : '155.0mm';
                        galleryImages.push({
                            url: h.thermal_snapshot,
                            title: `${inc.id} - Round ${idx + 1} (Thermal)`,
                            info: `Time: ${h.timestamp} | Lens: ${hThmFocal} | Heat: ${h.area_px || 0} px² | Az: ${h.azimuth}° Alt: ${h.altitude}°`
                        });
                    }
                    if (h.visible_snapshot) {
                        const hVis = h.zoom_info && h.zoom_info.visible ? h.zoom_info.visible : {};
                        const hVisFocal = hVis.focal_mm ? `${hVis.focal_mm}mm` : '15.1mm';
                        galleryImages.push({
                            url: h.visible_snapshot,
                            title: `${inc.id} - Round ${idx + 1} (Visible Context)`,
                            info: `Time: ${h.timestamp} | Lens: ${hVisFocal} | Az: ${h.azimuth}° Alt: ${h.altitude}°`
                        });
                    }
                });

                // Multi-round carousel cards
                const roundsHtml = historyList.length > 0 ? `
                    <div class="rounds-section">
                        <div class="rounds-section-title">
                            <span>SCAN ROUNDS & TIMELINE ARCHIVE (${historyList.length} Rounds)</span>
                            <span style="font-size: 10px; color: #64748b;">Click thumbnails to zoom | Hover &times; to delete round</span>
                        </div>
                        <div class="rounds-carousel">
                            ${historyList.map((h, rIdx) => `
                                <div class="round-card-mini" id="round-card-${inc.id}-${rIdx}">
                                    <button type="button" class="btn-delete-round" title="Delete this round snapshot" onclick="deleteIncidentRound('${inc.id}', ${rIdx}, event)">&times;</button>
                                    <div style="font-size: 9px; font-weight: 700; color: #38bdf8;">RND ${rIdx + 1}</div>
                                    <div class="round-card-thumb-grid" onclick='openModalGallery(${JSON.stringify(galleryImages)}, ${rIdx * 2})'>
                                        <img src="${h.thermal_snapshot || ''}" alt="Th" title="Thermal Rnd ${rIdx + 1}" onerror="this.style.opacity=0.3;" />
                                        <img src="${h.visible_snapshot || ''}" alt="Vis" title="Visible Rnd ${rIdx + 1}" onerror="this.style.opacity=0.3;" />
                                    </div>
                                    <div class="font-mono text-orange" style="font-size: 8.5px; font-weight: 700;">${h.area_px || 0} px²</div>
                                    <div class="font-mono" style="font-size: 8px; color: #38bdf8;">${h.zoom_info && h.zoom_info.focal_mm ? `${h.zoom_info.focal_mm}mm` : ''}</div>
                                    <div class="font-mono text-muted" style="font-size: 8px;">${(h.timestamp || '').split(' ')[1] || h.timestamp}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : '';

                // AI LLM Verification Block
                let llmHtml = '';
                const llm = inc.llm_verification;
                if (llm && typeof llm === 'object' && llm.risk_level) {
                    const risk = String(llm.risk_level || 'UNKNOWN').toUpperCase();
                    let riskClass = 'badge-risk-low';
                    let riskText = risk;
                    if (risk === 'HIGH') {
                        riskClass = 'badge-risk-high';
                        riskText = '🔴 HIGH RISK (ยืนยันไฟป่า)';
                    } else if (risk === 'MEDIUM') {
                        riskClass = 'badge-risk-medium';
                        riskText = '🟠 MEDIUM RISK (เฝ้าระวัง)';
                    } else if (risk === 'LOW') {
                        riskClass = 'badge-risk-low';
                        riskText = '🟡 LOW RISK (ความเสี่ยงต่ำ)';
                    } else if (risk === 'FALSE_ALARM') {
                        riskClass = 'badge-risk-false-alarm';
                        riskText = '🟢 FALSE ALARM (แดดสะท้อน/หินร้อน)';
                    }

                    llmHtml = `
                        <div class="llm-verification-box">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 14px;">🤖</span>
                                    <span style="font-weight: 700; font-size: 12px; color: #fff; letter-spacing: 0.5px;">AI MULTIMODAL VERIFICATION</span>
                                    <span class="badge ${riskClass}" style="font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 700;">${riskText}</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="font-mono text-muted" style="font-size: 10px;">${llm.analyzed_at || ''} (${llm.latency_sec || 0}s)</span>
                                    <button type="button" class="btn btn-secondary font-mono" style="padding: 2px 8px; font-size: 10px;" onclick="verifyIncidentWithLLM('${inc.id}', this)">
                                        🔄 RE-ANALYZE
                                    </button>
                                </div>
                            </div>
                            <div style="font-size: 12px; color: #cbd5e1; line-height: 1.5; margin-bottom: 6px;">
                                <strong style="color: #38bdf8;">การวิเคราะห์:</strong> ${llm.reason || '-'}
                            </div>
                            ${llm.thermal_detail ? `<div style="font-size: 11.5px; color: #f97316; margin-bottom: 4px;"><strong>Thermal:</strong> ${llm.thermal_detail}</div>` : ''}
                            ${llm.visible_detail ? `<div style="font-size: 11.5px; color: #06b6d4; margin-bottom: 4px;"><strong>Visible:</strong> ${llm.visible_detail}</div>` : ''}
                            ${llm.recommendation ? `<div style="font-size: 11.5px; color: #a7f3d0; margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.1);"><strong>📋 คำแนะนำ:</strong> ${llm.recommendation}</div>` : ''}
                        </div>
                    `;
                } else {
                    llmHtml = `
                        <div class="llm-verification-box llm-unverified">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 14px;">🤖</span>
                                    <span style="font-size: 11.5px; color: #94a3b8;">ยังไม่ได้ผ่านการวิเคราะห์ด้วย LLM หรือปิดใช้งานขณะตรวจพบ</span>
                                </div>
                                <button type="button" class="btn btn-primary font-mono" style="padding: 4px 12px; font-size: 11px;" onclick="verifyIncidentWithLLM('${inc.id}', this)">
                                    ⚡ ANALYZE WITH LLM
                                </button>
                            </div>
                        </div>
                    `;
                }

                // Zoom & Focal length metadata
                const zInfo = inc.zoom_info || (historyList.length > 0 ? historyList[historyList.length - 1].zoom_info : null) || {};
                const thmZoom = zInfo.thermal || zInfo || {};
                const focalVal = thmZoom.focal_mm ? Number(thmZoom.focal_mm).toFixed(1) : (zInfo.focal_mm ? Number(zInfo.focal_mm).toFixed(1) : '155.0');
                const zoomFactor = thmZoom.zoom_x ? Number(thmZoom.zoom_x).toFixed(1) : (focalVal ? (Number(focalVal) / 31.0).toFixed(1) : '5.0');
                const fovVal = thmZoom.fov_h && thmZoom.fov_v ? `${thmZoom.fov_h}°×${thmZoom.fov_v}°` : (thmZoom.fov_h ? `${thmZoom.fov_h}°` : '2.8°×2.3°');

                const visZoom = zInfo.visible || {};
                const visFocalVal = visZoom.focal_mm ? Number(visZoom.focal_mm).toFixed(1) : '15.1';
                const visZoomFactor = visZoom.zoom_x ? Number(visZoom.zoom_x).toFixed(1) : (visFocalVal ? (Number(visFocalVal) / 5.1).toFixed(1) : '3.0');
                const visFovVal = visZoom.fov_h && visZoom.fov_v ? `${visZoom.fov_h}°×${visZoom.fov_v}°` : (visZoom.fov_h ? `${visZoom.fov_h}°` : '18.6°×10.2°');

                const zoomBadgeText = `🔭 Th: ${focalVal}mm (${zoomFactor}x) | Vis: ${visFocalVal}mm (${visZoomFactor}x)`;

                return `
                    <div class="incident-card-full" id="inc-card-${inc.id}">
                        <div class="inc-header-row">
                            <div class="inc-title-group">
                                <span class="inc-id-tag font-mono">${inc.id}</span>
                                <span class="badge font-mono text-cyan" style="font-size: 11px; padding: 3px 8px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); border-radius: 4px;">
                                    Az: ${(inc.current_azimuth || inc.azimuth || 0).toFixed(1)}° / Alt: ${(inc.current_altitude || inc.altitude || 0).toFixed(1)}°
                                </span>
                                <span class="badge font-mono" style="font-size: 11px; padding: 3px 8px; background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.25); border-radius: 4px; color: #cbd5e1;" title="Dual Camera Focal Length & Optical Zoom">
                                    ${zoomBadgeText}
                                </span>
                                <span class="badge-trend ${trendClass}">${trendLabel}</span>
                                <span class="badge font-mono text-orange" style="font-size: 11px; padding: 3px 8px; background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.3); border-radius: 4px;">
                                    ${totalRounds} Round${totalRounds > 1 ? 's' : ''}
                                </span>
                            </div>
                            <div class="inc-actions-group">
                                <button type="button" class="btn btn-primary font-mono" style="padding: 4px 10px; font-size: 11px;" onclick="verifyIncidentWithLLM('${inc.id}', this)">
                                    🤖 ASK LLM
                                </button>
                                <button type="button" class="btn btn-secondary font-mono" style="padding: 4px 10px; font-size: 11px;" onclick="gotoIncidentPosition(${inc.current_azimuth || inc.azimuth || 0}, ${inc.current_altitude || inc.altitude || 0})">
                                    PTZ AIM
                                </button>
                                <button type="button" class="btn btn-danger font-mono" style="padding: 4px 10px; font-size: 11px;" onclick="deleteIncidentRecord('${inc.id}')">
                                    DELETE INCIDENT
                                </button>
                            </div>
                        </div>

                        <!-- Dual Camera Snapshots -->
                        <div class="snapshots-compare-container">
                            <!-- Thermal Snapshot -->
                            <div class="snapshot-box">
                                <div class="snapshot-box-header">
                                    <span class="text-orange">LATEST THERMAL SNAPSHOT (${focalVal} mm)</span>
                                    <span class="font-mono text-orange">${inc.current_area_px || inc.initial_area_px || 0} px²</span>
                                </div>
                                <div class="snapshot-img-wrap" onclick='openModalGallery(${JSON.stringify(galleryImages)}, ${Math.max(0, (historyList.length - 1) * 2)})'>
                                    <img src="${inc.latest_thermal_snapshot || inc.initial_thermal_snapshot || ''}" alt="Thermal Snapshot" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><text x=\\'50%25\\' y=\\'50%25\\' fill=\\'%2364748b\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\'>No Thermal</text></svg>';" />
                                    <span class="img-zoom-hint">Click to Zoom</span>
                                </div>
                            </div>

                            <!-- Visible Snapshot -->
                            <div class="snapshot-box">
                                <div class="snapshot-box-header">
                                    <span class="text-cyan">LATEST OPTICAL CONTEXT SNAPSHOT (${visFocalVal} mm)</span>
                                    <span class="font-mono text-cyan">${visFovVal}</span>
                                </div>
                                <div class="snapshot-img-wrap" onclick='openModalGallery(${JSON.stringify(galleryImages)}, ${Math.max(0, (historyList.length - 1) * 2 + 1)})'>
                                    <img src="${inc.latest_visible_snapshot || inc.initial_visible_snapshot || ''}" alt="Visible Snapshot" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><text x=\\'50%25\\' y=\\'50%25\\' fill=\\'%2364748b\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\'>No Optical</text></svg>';" />
                                    <span class="img-zoom-hint">Click to Zoom</span>
                                </div>
                            </div>
                        </div>

                        <!-- Multi-Round Timeline -->
                        ${roundsHtml}

                        <!-- AI LLM Verification -->
                        ${llmHtml}

                        <!-- Metrics Footer Grid -->
                        <div class="inc-metrics-grid">
                            <div class="inc-metric-pill">
                                <div class="lbl">FIRST DETECTED</div>
                                <div class="val font-mono" style="font-size: 11px; color: #cbd5e1;">${inc.first_detected || '-'}</div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">LAST VISITED</div>
                                <div class="val font-mono" style="font-size: 11px; color: #cbd5e1;">${inc.last_updated || '-'}</div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">INITIAL HEAT AREA</div>
                                <div class="val font-mono text-cyan">${inc.initial_area_px || 0} px²</div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">CURRENT HEAT AREA</div>
                                <div class="val font-mono text-orange">${inc.current_area_px || 0} px²</div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">TOTAL GROWTH</div>
                                <div class="val font-mono ${Number(inc.total_growth_pct || 0) > 0 ? 'text-red' : 'text-emerald'}">
                                    ${Number(inc.total_growth_pct || 0) > 0 ? '+' : ''}${inc.total_growth_pct || 0}%
                                </div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">TREND SLOPE</div>
                                <div class="val font-mono text-cyan">
                                    ${Number(inc.trend_slope_pct || 0) > 0 ? '+' : ''}${inc.trend_slope_pct || 0}%/rnd
                                </div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">THERMAL OPTICS</div>
                                <div class="val font-mono text-orange" style="font-size: 10.5px;">
                                    ${focalVal} mm <span style="color: #94a3b8; font-size: 9.5px;">(${fovVal})</span>
                                </div>
                            </div>
                            <div class="inc-metric-pill">
                                <div class="lbl">VISIBLE OPTICS</div>
                                <div class="val font-mono text-cyan" style="font-size: 10.5px;">
                                    ${visFocalVal} mm <span style="color: #94a3b8; font-size: 9.5px;">(${visFovVal})</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Delete Whole Incident
        async function deleteIncidentRecord(incidentId) {
            if (!confirm(`Are you sure you want to delete incident record [${incidentId}] and its snapshot images?`)) {
                return;
            }

            try {
                const res = await fetch(`/api/incidents/${incidentId}/delete`, {
                    method: "POST"
                });
                const data = await res.json();
                if (data.status === "ok") {
                    allIncidents = allIncidents.filter(i => i.id !== incidentId);
                    renderIncidentsList();
                } else {
                    alert("Failed to delete incident: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                console.error("Delete incident error:", err);
                alert("Network error deleting incident");
            }
        }

        // Delete Single Round
        async function deleteIncidentRound(incidentId, roundIdx, event) {
            if (event) event.stopPropagation();
            if (!confirm(`Delete snapshot data for Round ${roundIdx + 1}?`)) {
                return;
            }

            try {
                const res = await fetch(`/api/incidents/${incidentId}/rounds/${roundIdx}/delete`, {
                    method: "POST"
                });
                const data = await res.json();
                if (data.status === "ok") {
                    if (data.incident && data.incident.deleted_whole_incident) {
                        allIncidents = allIncidents.filter(i => i.id !== incidentId);
                    } else if (data.incident) {
                        const idx = allIncidents.findIndex(i => i.id === incidentId);
                        if (idx !== -1) {
                            allIncidents[idx] = data.incident;
                        }
                    }
                    renderIncidentsList();
                } else {
                    alert("Failed to delete round: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                console.error("Delete round error:", err);
                alert("Network error deleting round");
            }
        }

        // Clear All Records
        async function clearAllArchive() {
            if (!confirm("⚠️ CAUTION: Are you sure you want to permanently clear ALL recorded fire incidents and snapshot images from storage?")) {
                return;
            }

            try {
                const res = await fetch("/api/incidents/clear", { method: "POST" });
                const data = await res.json();
                if (data.status === "ok") {
                    allIncidents = [];
                    renderIncidentsList();
                } else {
                    alert("Failed to clear archive: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                console.error("Clear archive error:", err);
                alert("Network error clearing archive");
            }
        }

        // PTZ GOTO Aim
        async function gotoIncidentPosition(az, alt) {
            try {
                const res = await fetch("/api/ptz/control", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: "goto",
                        az: az,
                        alt: alt,
                        speed: 10.0
                    })
                });
                if (res.ok) {
                    alert(`PTZ Mount slewing to Az: ${az.toFixed(1)}°, Alt: ${alt.toFixed(1)}°`);
                } else {
                    alert("Failed to send PTZ command");
                }
            } catch (err) {
                console.error("PTZ GOTO error:", err);
                alert("Network error communicating with PTZ");
            }
        }

        // On-demand LLM Verification
        async function verifyIncidentWithLLM(incidentId, btnEl) {
            let origHtml = "";
            if (btnEl) {
                origHtml = btnEl.innerHTML;
                btnEl.disabled = true;
                btnEl.innerHTML = '<span class="spinner-mini"></span> AI Analyzing...';
            }

            try {
                const res = await fetch(`/api/incidents/${incidentId}/verify_llm`, { method: "POST" });
                let data;
                try {
                    data = await res.json();
                } catch (parseErr) {
                    throw new Error(`HTTP ${res.status} (${res.statusText || 'Server Error'})`);
                }
                if (data.status === "ok") {
                    const idx = allIncidents.findIndex(i => i.id === incidentId);
                    if (idx !== -1) {
                        allIncidents[idx] = data.incident;
                    }
                    renderIncidentsList();
                } else {
                    alert("LLM Verification Error: " + (data.message || "Failed to analyze incident"));
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.innerHTML = origHtml || "🤖 RETRY LLM";
                    }
                }
            } catch (err) {
                console.error("LLM verification error:", err);
                alert("Network error communicating with server: " + err.message);
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.innerHTML = origHtml || "🤖 RETRY LLM";
                }
            }
        }

        // Event Listeners
        document.getElementById("btn-refresh-archive").addEventListener("click", fetchIncidents);
        document.getElementById("btn-clear-all-archive").addEventListener("click", clearAllArchive);
        document.getElementById("filter-trend-select").addEventListener("change", renderIncidentsList);
        document.getElementById("search-incidents-input").addEventListener("input", renderIncidentsList);

        // Initial Load
        fetchIncidents();
    </script>
</body>
</html>
